name: Deploy Ohana Studios to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # Picks up the games' newest web demos every night.
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "command=ci" >> $GITHUB_OUTPUT
          echo "runner=npx --no-install" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fetch the game demos
        # Each game's CI on main publishes its web demo: as web-demo.zip on a rolling
        # "web-demo" release (puzzle-game, Nir-Ohana/puzzle-game#580; release files
        # do not count against the artifact storage quota), or as the "web-demo"
        # artifact. The release is tried first. The games are private, so this
        # needs GAME_DEMOS_TOKEN: a fine-grained token with Contents: read and
        # Actions: read on puzzle-game, rocket-rabbit and pili-words.
        # A game without a readable demo keeps the one committed here.
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GAME_DEMOS_TOKEN || github.token }}
          script: |
            const fs = require('node:fs');
            const games = [
              { repo: 'puzzle-game', folder: 'play' },
              { repo: 'rocket-rabbit', folder: 'rocket-rabbit-play' },
              { repo: 'pili-words', folder: 'pili-words-play' },
            ];
            fs.mkdirSync('demos', { recursive: true });
            async function fromRelease(repo, folder) {
              try {
                const { data: release } = await github.rest.repos.getReleaseByTag({ owner: 'Nir-Ohana', repo, tag: 'web-demo' });
                const asset = release.assets.find(a => a.name === 'web-demo.zip');
                if (!asset) return false;
                const zip = await github.rest.repos.getReleaseAsset({
                  owner: 'Nir-Ohana', repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' },
                });
                fs.writeFileSync(`demos/${folder}.zip`, Buffer.from(zip.data));
                core.info(`${repo}: web-demo release asset from ${asset.updated_at}`);
                return true;
              } catch (error) {
                if (error.status !== 404) core.warning(`${repo}: web-demo release: ${error.message}`);
                return false;
              }
            }
            for (const { repo, folder } of games) {
              if (await fromRelease(repo, folder)) continue;
              try {
                const { data } = await github.rest.actions.listArtifactsForRepo({
                  owner: 'Nir-Ohana', repo, name: 'web-demo', per_page: 50,
                });
                const artifact = data.artifacts
                  .filter(a => !a.expired && a.workflow_run?.head_branch === 'main')
                  .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
                if (!artifact) { core.warning(`${repo}: no web-demo artifact from main; keeping public/${folder}`); continue; }
                const zip = await github.rest.actions.downloadArtifact({
                  owner: 'Nir-Ohana', repo, artifact_id: artifact.id, archive_format: 'zip',
                });
                fs.writeFileSync(`demos/${folder}.zip`, Buffer.from(zip.data));
                core.info(`${repo}: web-demo from ${artifact.created_at} (run ${artifact.workflow_run.id})`);
              } catch (error) {
                core.warning(`${repo}: ${error.message}; keeping public/${folder}`);
              }
            }

      - name: Install the game demos
        run: |
          for zip in demos/*.zip; do
            [ -e "$zip" ] || continue
            folder=$(basename "$zip" .zip)
            mkdir -p "demos/$folder"
            python3 -m zipfile -e "$zip" "demos/$folder"
            sh scripts/install-demo.sh "demos/$folder" "$folder"
          done
          rm -rf demos

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Check types and SEO output
        run: |
          npm run check
          npm run test:seo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
