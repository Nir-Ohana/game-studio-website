<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 80 80">
  <defs>
    <!-- Multi-stage Ambient Drop Shadow & Golden Radiance -->
    <filter id="floatingGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#02131F" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.6"/>
    </filter>

    <!-- Deep 3D Body Gradient (Sunlit Gold to Rich Amber Honey) -->
    <linearGradient id="bodyGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="12%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FCD34D"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="88%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Bevel Light Rim (Top-Left Highlight to Bottom-Right Shade) -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Soft Radial Center Light -->
    <radialGradient id="centerBulge" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FEF08A" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#floatingGlow)">
    <!-- 1. Soft Bottom Rim (Gives physical 3D thickness) -->
    <path transform="translate(0, 2.5)" d="
      M 24 18
      H 34
      C 34.6 18 34.2 15 33 12.5
      C 31.5 9 33.5 4 40 4
      C 46.5 4 48.5 9 47 12.5
      C 45.8 15 45.4 18 46 18
      H 56
      A 5.5 5.5 0 0 1 61.5 23.5
      V 34
      C 61.5 34.6 64.5 34.2 67 33
      C 70.5 31.5 75.5 33.5 75.5 40
      C 75.5 46.5 70.5 48.5 67 47
      C 64.5 45.8 61.5 45.4 61.5 46
      V 56
      A 5.5 5.5 0 0 1 56 61.5
      H 46
      C 45.4 61.5 45.8 58.5 47 56
      C 48.5 52.5 46.5 47.5 40 47.5
      C 33.5 47.5 31.5 52.5 33 56
      C 34.2 58.5 34.6 61.5 34 61.5
      H 24
      A 5.5 5.5 0 0 1 18.5 56
      V 46
      C 18.5 45.4 21.5 45.8 24 47
      C 27.5 48.5 32.5 46.5 32.5 40
      C 32.5 33.5 27.5 31.5 24 33
      C 21.5 34.2 18.5 34.6 18.5 34
      V 23.5
      A 5.5 5.5 0 0 1 24 18
      Z
    " fill="#854203" opacity="0.75" />

    <!-- 2. Main Golden Puzzle Body -->
    <path d="
      M 24 18
      H 34
      C 34.6 18 34.2 15 33 12.5
      C 31.5 9 33.5 4 40 4
      C 46.5 4 48.5 9 47 12.5
      C 45.8 15 45.4 18 46 18
      H 56
      A 5.5 5.5 0 0 1 61.5 23.5
      V 34
      C 61.5 34.6 64.5 34.2 67 33
      C 70.5 31.5 75.5 33.5 75.5 40
      C 75.5 46.5 70.5 48.5 67 47
      C 64.5 45.8 61.5 45.4 61.5 46
      V 56
      A 5.5 5.5 0 0 1 56 61.5
      H 46
      C 45.4 61.5 45.8 58.5 47 56
      C 48.5 52.5 46.5 47.5 40 47.5
      C 33.5 47.5 31.5 52.5 33 56
      C 34.2 58.5 34.6 61.5 34 61.5
      H 24
      A 5.5 5.5 0 0 1 18.5 56
      V 46
      C 18.5 45.4 21.5 45.8 24 47
      C 27.5 48.5 32.5 46.5 32.5 40
      C 32.5 33.5 27.5 31.5 24 33
      C 21.5 34.2 18.5 34.6 18.5 34
      V 23.5
      A 5.5 5.5 0 0 1 24 18
      Z
    " fill="url(#bodyGrad)" stroke="url(#rimGrad)" stroke-width="2" stroke-linejoin="round"/>

    <!-- 3. Soft Radial Volume / Pillow Cushion -->
    <path d="
      M 24 18
      H 34
      C 34.6 18 34.2 15 33 12.5
      C 31.5 9 33.5 4 40 4
      C 46.5 4 48.5 9 47 12.5
      C 45.8 15 45.4 18 46 18
      H 56
      A 5.5 5.5 0 0 1 61.5 23.5
      V 34
      C 61.5 34.6 64.5 34.2 67 33
      C 70.5 31.5 75.5 33.5 75.5 40
      C 75.5 46.5 70.5 48.5 67 47
      C 64.5 45.8 61.5 45.4 61.5 46
      V 56
      A 5.5 5.5 0 0 1 56 61.5
      H 46
      C 45.4 61.5 45.8 58.5 47 56
      C 48.5 52.5 46.5 47.5 40 47.5
      C 33.5 47.5 31.5 52.5 33 56
      C 34.2 58.5 34.6 61.5 34 61.5
      H 24
      A 5.5 5.5 0 0 1 18.5 56
      V 46
      C 18.5 45.4 21.5 45.8 24 47
      C 27.5 48.5 32.5 46.5 32.5 40
      C 32.5 33.5 27.5 31.5 24 33
      C 21.5 34.2 18.5 34.6 18.5 34
      V 23.5
      A 5.5 5.5 0 0 1 24 18
      Z
    " fill="url(#centerBulge)"/>

    <!-- 4. Top Tab Specular Gleam -->
    <ellipse cx="40" cy="9.5" rx="4.5" ry="2.2" fill="#FFFFFF" opacity="0.8"/>
    <!-- Right Tab Specular Gleam -->
    <ellipse cx="70.5" cy="39.5" rx="2.2" ry="4" fill="#FFFFFF" opacity="0.65"/>
    
    <!-- Edge Specular Light Strokes -->
    <path d="M 25 20.5 H 33.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 46.5 20.5 H 55" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M 21 24.5 V 33" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 21 47 V 55" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
