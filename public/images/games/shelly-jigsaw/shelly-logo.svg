<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12687F"/>
      <stop offset="50%" stop-color="#094A5B"/>
      <stop offset="100%" stop-color="#05333F"/>
    </linearGradient>
    <linearGradient id="splashGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EF7FF"/>
      <stop offset="60%" stop-color="#2BD7EB"/>
      <stop offset="100%" stop-color="#0E8A9E"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#01222B" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#7DF8FF" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Water Splashes and Droplets around Title -->
  <g fill="url(#splashGrad)">
    <!-- Left Splash Arcs -->
    <path d="M75 95 C60 75 80 50 92 65 C85 75 75 85 75 95 Z"/>
    <path d="M60 120 C42 105 55 85 68 100 C62 110 55 118 60 120 Z"/>
    <circle cx="52" cy="72" r="5.5"/>
    <circle cx="42" cy="98" r="4"/>
    <circle cx="68" cy="48" r="3.5"/>

    <!-- Right Splash Arcs -->
    <path d="M395 105 C412 85 395 62 382 75 C390 85 398 95 395 105 Z"/>
    <path d="M410 135 C428 118 415 95 402 110 C408 122 414 130 410 135 Z"/>
    <circle cx="425" cy="85" r="5"/>
    <circle cx="438" cy="115" r="4.5"/>
    <circle cx="405" cy="55" r="4"/>

    <!-- Bottom Wave flourish under Jigsaw -->
    <path d="M140 195 Q240 215 340 195 Q280 185 240 200 Q200 185 140 195 Z" opacity="0.85"/>
  </g>

  <!-- Main Text Group -->
  <g filter="url(#logoShadow)">
    <!-- "Shelly" text -->
    <text x="240" y="92" 
          font-family="'Fraunces', 'Arial Black', serif" 
          font-size="88" 
          font-weight="900" 
          font-style="normal" 
          text-anchor="middle" 
          fill="url(#titleGrad)"
          stroke="#FFFFFF" 
          stroke-width="3"
          paint-order="stroke fill"
          letter-spacing="1">Shelly</text>

    <!-- "Jigsaw" text -->
    <text x="240" y="178" 
          font-family="'Fraunces', 'Arial Black', serif" 
          font-size="94" 
          font-weight="900" 
          font-style="normal" 
          text-anchor="middle" 
          fill="url(#titleGrad)"
          stroke="#FFFFFF" 
          stroke-width="3"
          paint-order="stroke fill"
          letter-spacing="2">Jigsaw</text>
  </g>

  <!-- Specular Caustic Highlights on Letters -->
  <g fill="#E4FCFF" opacity="0.65">
    <ellipse cx="160" cy="52" rx="14" ry="4" transform="rotate(-15 160 52)"/>
    <ellipse cx="235" cy="48" rx="8" ry="3"/>
    <ellipse cx="295" cy="46" rx="8" ry="3"/>
    <ellipse cx="145" cy="132" rx="12" ry="4" transform="rotate(-10 145 132)"/>
    <ellipse cx="225" cy="128" rx="10" ry="3"/>
    <ellipse cx="320" cy="126" rx="12" ry="4" transform="rotate(10 320 126)"/>
  </g>
</svg>
