<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <!-- Piece 1: Sky Blue / Cyan -->
    <linearGradient id="logoSkyCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Piece 2: Indigo Glow / Violet -->
    <linearGradient id="logoIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Piece 3: Deep Ocean Teal -->
    <linearGradient id="logoTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Piece 4: Emerald Sea -->
    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Center Diamond Core Star -->
    <linearGradient id="logoCoreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Wordmark "STUDIOS" Gradient -->
    <linearGradient id="studiosGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Accent Rule Line Gradient -->
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Insignia -->
    <filter id="insigniaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. The Ohana Studios Geometric Insignia (Center: 38, 36) -->
  <g id="insignia" filter="url(#insigniaShadow)">
    <!-- Ambient Glow Behind Insignia -->
    <circle cx="38" cy="36" r="25" fill="#38BDF8" opacity="0.08" />

    <!-- 4 Precision Interlocking Puzzle Pieces forming an unbroken "O" Monogram -->
    <!-- Piece 1: Top-Left (Sky/Cyan) -->
    <!-- Outer arc from 9 to 12 o'clock, inner arc returning, with interlocking tabs -->
    <path d="M 38 12 
             C 42 12 44 14 44 16.5 C 44 19 42 21 38 21
             L 38 24
             C 31.4 24 26 29.4 26 36
             L 22 36 C 22 32 20 30 17.5 30 C 15 30 13 32 13 36
             L 14 36
             C 14 22.7 24.7 12 38 12 Z"
          fill="url(#logoSkyCyan)" stroke="#0B0F19" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Piece 2: Top-Right (Indigo / Violet) -->
    <!-- Outer arc from 12 to 3 o'clock, with tab receiver at top, tab out at right -->
    <path d="M 38 12
             C 51.3 12 62 22.7 62 36
             L 57 36 C 57 39.5 55 41.5 52.5 41.5 C 50 41.5 48 39.5 48 36
             L 50 36
             C 50 29.4 44.6 24 38 24
             L 38 21
             C 42 21 44 19 44 16.5 C 44 14 42 12 38 12 Z"
          fill="url(#logoIndigo)" stroke="#0B0F19" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Piece 3: Bottom-Right (Ocean Teal) -->
    <!-- Outer arc from 3 to 6 o'clock, with tab receiver at right, tab out at bottom -->
    <path d="M 62 36
             C 62 49.3 51.3 60 38 60
             L 38 55 C 34 55 32 53 32 50.5 C 32 48 34 46 38 46
             L 38 48
             C 44.6 48 50 42.6 50 36
             L 48 36
             C 48 39.5 50 41.5 52.5 41.5 C 55 41.5 57 39.5 57 36
             L 62 36 Z"
          fill="url(#logoTeal)" stroke="#0B0F19" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Piece 4: Bottom-Left (Emerald Sea) -->
    <!-- Outer arc from 6 to 9 o'clock, with tab receiver at bottom, tab out at left -->
    <path d="M 38 60
             C 24.7 60 14 49.3 14 36
             L 13 36 C 13 32 15 30 17.5 30 C 20 30 22 32 22 36
             L 26 36
             C 26 42.6 31.4 48 38 48
             L 38 46
             C 34 46 32 48 32 50.5 C 32 53 34 55 38 55
             L 38 60 Z"
          fill="url(#logoEmerald)" stroke="#0B0F19" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Outer & Inner Highlight Rims -->
    <circle cx="38" cy="36" r="23.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.25" />
    <circle cx="38" cy="36" r="12.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.2" />

    <!-- Center Core: 4-Point Radiant Sparkle Star -->
    <path d="M 38 31 Q 38 36 33 36 Q 38 36 38 41 Q 38 36 43 36 Q 38 36 38 31 Z"
          fill="url(#logoCoreGold)" stroke="#B45309" stroke-width="0.5" stroke-linejoin="round" />
    <circle cx="38" cy="36" r="1" fill="#FFFFFF" />
  </g>

  <!-- 2. Typography: OHANA STUDIOS -->
  <!-- Primary Title: OHANA -->
  <text x="76" y="38"
        font-family="system-ui, -apple-system, 'Outfit', 'Plus Jakarta Sans', sans-serif"
        font-size="28"
        font-weight="900"
        letter-spacing="0.12em"
        fill="#F8FAFC">OHANA</text>

  <!-- Subtle Accent Diamond Sparkle beside OHANA -->
  <path d="M 218 20 Q 218 24 214 24 Q 218 24 218 28 Q 218 24 222 24 Q 218 24 218 20 Z"
        fill="#38BDF8" />

  <!-- Sub-brand: STUDIOS -->
  <text x="78" y="56"
        font-family="system-ui, -apple-system, 'Outfit', 'Plus Jakarta Sans', sans-serif"
        font-size="11.5"
        font-weight="700"
        letter-spacing="0.38em"
        fill="url(#studiosGrad)">STUDIOS</text>

  <!-- Modern Gradient Rule Accent Line -->
  <line x1="172" y1="52.5" x2="304" y2="52.5"
        stroke="url(#ruleGrad)"
        stroke-width="1.5"
        stroke-linecap="round" />
</svg>
